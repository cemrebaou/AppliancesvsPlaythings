<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Appliances vs Playthings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b120b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Ev aletleri ile karanlık oyuncaklara karşı kule savunma oyunu.">
<link rel="preload" as="image" href="assets/bg_room.jpg">
<link rel="preload" as="image" href="assets/atlas.webp">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #130c07;
    overflow: hidden;
    touch-action: none;              /* mobilde kaydırma/zoom kapalı */
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #oyun { width: 100%; height: 100%; display: flex; }
  #oyun canvas { display: block; margin: auto; touch-action: none; }

  /* Telefon dikeyken uyarı */
  #cevir {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #130c07; color: #ffd54a; text-align: center;
    font-size: 19px; line-height: 1.6; padding: 24px; z-index: 50;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #cevir { display: flex; }
    #oyun { visibility: hidden; }
  }
</style>
</head>
<body>
  <div id="oyun"></div>
  <div id="cevir">📱↻<br>Telefonu yatay çevir<br><small>Appliances vs Playthings</small></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
